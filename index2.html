<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#152048">
  <title>Mola360 — Yükleniyor</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Bu sayfada yalnızca açılış loader'ı aktiftir; başka içerik/script yüklenmez. -->
<div id="siteLoader" role="status" aria-label="Mola360 yükleniyor">
  <img
    class="site-loader-logo"
    src="assets/img/logo.png"
    alt="mola360"
    draggable="false"
  >
</div>

<script>
  (function () {
    const loader = document.getElementById('siteLoader');
    if (!loader) return;

    // Loader tam 3 saniye ekranda kalır; ardından kısa bir fade-out ile kapanır.
    const hideLoader = () => {
      loader.classList.add('is-hidden');
      window.setTimeout(() => loader.remove(), 400);
    };

    window.setTimeout(hideLoader, 3000);
  })();
</script>

</body>
</html>
