<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tur sayfası taşındı — mola360</title>

  <!-- Bu sayfa bir yonlendirme.
       Tur sayfalari /tur.html?tur=<slug> adresinden /tur/<slug>/ adresine
       tasindi. Eski adresi paylasmis veya yer imine eklemis olanlarin
       elinde kirik bir bag kalmasin diye burasi duruyor.

       GitHub Pages sunucu tarafi yonlendirme (301) yapamiyor; bu yuzden
       hem meta refresh hem JS hem de gorunur bir bag var. canonical ve
       robots satirlari arama motoruna asil adresi soyluyor. -->
  <link rel="canonical" href="https://bedirinci.github.io/mola360/tur/efes-sirince/">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=tur/efes-sirince/">

  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .tasindi {
      max-width: 460px;
      margin: 18vh auto;
      padding: 0 24px;
      text-align: center;
      font-family: 'Inter', sans-serif;
    }
    .tasindi h1 { font-size: 20px; color: var(--navy-deep); margin-bottom: 10px; }
    .tasindi p { font-size: 14.5px; line-height: 1.6; color: var(--text-muted); margin-bottom: 18px; }
    .tasindi a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 12px;
      background: var(--green);
      color: #183008;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="tasindi">
    <h1>Bu sayfa taşındı</h1>
    <p>Tur sayfaları artık <code>/tur/&lt;tur-adi&gt;/</code> adresinde.
       Birkaç saniye içinde yönlendirilmiyorsanız aşağıdaki bağlantıyı kullanın.</p>
    <a href="tur/efes-sirince/">Tur sayfasına git</a>
  </div>

  <script>
    /* Eski adres bir slug tasiyorsa (tur.html?tur=kapadokya-3-gece) o turun
       yeni adresine gidilir; tasimiyorsa varsayilan tura. */
    (function () {
      var m = window.location.search.match(/[?&]tur=([^&#]*)/);
      var slug = 'efes-sirince';
      if (m) {
        try {
          var okunan = decodeURIComponent(m[1].replace(/\+/g, ' ')).trim().toLowerCase();
          if (/^[a-z0-9-]+$/.test(okunan)) slug = okunan;
        } catch (_) {}
      }
      window.location.replace('tur/' + slug + '/');
    })();
  </script>
</body>
</html>
