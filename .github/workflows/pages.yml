name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["mola360"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Repo icin Pages henuz etkinlestirilmemisse ilk calistirmada otomatik acar.
          enablement: true

      # Tarayicilar style.css / app.js gibi sabit adli dosyalari onbellekte
      # tutuyor ve yeni surum yayinlandiginda eski dosyayi gosterebiliyor.
      # Her yayinda dosya adlarina commit'e ozel ?v=... eklenir; adres
      # degistigi icin tarayici dosyayi yeniden indirmek zorunda kalir.
      - name: Statik dosyalara surum damgasi ekle
        run: |
          VER="${GITHUB_SHA::8}"
          sed -E -i 's#(href|src)="(assets/(css|js)/[^"?]+\.(css|js))"#\1="\2?v='"$VER"'"#g' index.html
          echo "Surum: $VER"
          grep -nE 'assets/(css|js)/' index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
