name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Repo icin Pages henuz etkinlestirilmemisse ilk calistirmada otomatik acar.
          enablement: true

      # Tarayicilar style.css / app.js gibi sabit adli dosyalari onbellekte
      # tutuyor ve yeni surum yayinlandiginda eski dosyayi gosterebiliyor.
      # Her yayinda dosya adlarina commit'e ozel ?v=... eklenir; adres
      # degistigi icin tarayici dosyayi yeniden indirmek zorunda kalir.
      # Depodaki her HTML sayfasi damgalanir; yeni sayfa eklendiginde bu
      # adimi guncellemek gerekmez. Tur sayfalari tur/<slug>/index.html
      # icinde durup varliklara ../../assets/... ile bagladigi icin desen
      # bastaki ../ tekrarlarini da kapsar. _backup yedekleri haric.
      - name: Statik dosyalara surum damgasi ekle
        run: |
          VER="${GITHUB_SHA::8}"
          echo "Surum: $VER"
          find . -name '*.html' -not -path './arsiv/*' -not -path './node_modules/*' -print0 \
          | while IFS= read -r -d '' SAYFA; do
              sed -E -i 's#(href|src)="((\.\./)*assets/(css|js)/[^"?]+\.(css|js))"#\1="\2?v='"$VER"'"#g' "$SAYFA"
              echo "--- $SAYFA"
              grep -nE '(\.\./)*assets/(css|js)/' "$SAYFA" || true
            done

      # v2 de ayni sorunu yasar: sayfalar css/ ve js/ altindaki sabit adli
      # dosyalara baglanir, js modulleri de birbirini './api.js' gibi sabit
      # adlarla yukler. Bir kismi onbellekten eski, bir kismi yeni gelirse
      # moduller uyusmaz ve sayfa bozulur. HTML'deki baglar ve modullerin
      # birbirini yukledigi adresler ayni damgayi alir.
      - name: v2 dosyalarina surum damgasi ekle
        run: |
          VER="${GITHUB_SHA::8}"
          find v2 -name '*.html' -print0 \
          | while IFS= read -r -d '' SAYFA; do
              sed -E -i 's#(href|src)="((\.\./)*(css|js)/[^"?]+\.(css|js))"#\1="\2?v='"$VER"'"#g' "$SAYFA"
            done
          sed -E -i "s#(from *')(\./[a-z0-9-]+\.js)'#\1\2?v=$VER'#g" v2/js/*.js
          echo "--- damgasiz kalan v2 baglari (bos olmali):"
          grep -rnE "(href|src)=\"(\.\./)*(css|js)/[^\"?]+\"" v2 --include=*.html || true
          grep -nE "from *'\./[^'?]+'" v2/js/*.js || true

      # Backend yayina CIKMAZ. Statik sitenin yaninda sunucu kaynagi
      # sunmanin faydasi yok; ayrica yerelde olusturulan bir .env
      # yanlislikla commit edilirse yayina cikmasin diye.
      - name: Backend kaynagini yayin disinda birak
        run: rm -rf backend docker-compose.yml

      # Klasik site arsivde; yayina cikmaz (adresleri kok dizine gore
      # yazildigi icin arsiv klasorunden zaten calismaz).
      - name: Arsivi yayin disinda birak
        run: rm -rf arsiv

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
